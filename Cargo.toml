[package]
name = "thesis-compressor"
version = "0.1.0"
edition = "2024"
authors = ["Tomasz Rosik"]
description = "Byte-level Transformer for lossless text compression (master's thesis)"

[dependencies]
anyhow = "1"
candle-core = "0.10"
rand = "0.10"

[features]
default = []
cuda = ["candle-core/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
